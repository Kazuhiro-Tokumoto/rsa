<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>真・可変ローター数Enigma暗号機</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .info-box p {
            color: #555;
            line-height: 1.6;
            margin: 5px 0;
        }

        .charset-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .charset-info p {
            color: #856404;
            margin: 5px 0;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .password-info {
            margin-top: 5px;
            font-size: 0.85em;
            color: #666;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .copy-btn.copied {
            background: #48bb78;
        }

        .result-text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 16px;
            word-break: break-all;
            background: white;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .stats {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }

        .stats p {
            margin: 5px 0;
            color: #555;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 真・可変ローター数Enigma</h1>
        <p class="subtitle">文字→文字変換 | 日本語完全対応</p>

        <div class="info-box">
            <h3>💡 使い方</h3>
            <p>• パスワードの文字数だけローターが生成されます</p>
            <p>• 長いパスワード = より強力な暗号化</p>
            <p>• 同じパスワードで暗号化・復号化できます</p>
            <p>• <strong>文字は文字のまま変換（Base64不使用）</strong></p>
        </div>

        <div class="charset-info" id="charsetInfo">
            <p>📝 文字セット読み込み中...</p>
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="text" id="password" placeholder="暗号化のパスワードを入力">
            <div class="password-info" id="passwordInfo">パスワード長: 0文字 → ローター数: 0個</div>
        </div>

        <div class="form-group">
            <label for="message">メッセージ</label>
            <textarea id="message" placeholder="暗号化 or 復号化したいテキストを入力"></textarea>
            <div class="warning" id="charWarning" style="display: none;">
                ⚠️ 対応していない文字が含まれています。これらの文字はそのまま出力されます。
            </div>
        </div>

        <div class="button-group">
            <button onclick="process()" id="processBtn" disabled>🔄 変換（暗号化 / 復号化）</button>
        </div>

        <div class="loading" id="loading">処理中...</div>

        <div class="result" id="result">
            <h3 id="resultTitle">結果</h3>
            <div class="result-text" id="resultText"></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <script>
        let CHARSET = '';
        let charToIndex = new Map();
        let indexToChar = [];

        // 初期化
        async function initialize() {
            try {
                // 常用漢字をJSONから取得
                const response = await fetch('https://gist.githubusercontent.com/KEINOS/fb660943484008b7f5297bb627e0e1b1/raw/joyo2010.json');
                const data = await response.json();
                
                // 文字セットを構築
                let chars = new Set();
                
                // 常用漢字を追加（オブジェクトの各プロパティから）
                for (let key in data) {
                    if (data[key].joyo_kanji) {
                        chars.add(data[key].joyo_kanji);
                    }
                }
                
                // ひらがな・カタカナを追加
                const kana = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゃゅょっゎアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポャュョッヮァィゥェォ';
                for (let char of kana) {
                    chars.add(char);
                }
                
                // 英数字・記号を追加
                const ascii = '�ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?;:()[]{}@#$%&*+-=_/<>"\'\n\t、。！？「」『』（）【】〜・ー';
                for (let char of ascii) {
                    chars.add(char);
                }
                
                // 配列に変換してソート
                CHARSET = Array.from(chars).sort().join('');
                
                // マッピング作成
                for (let i = 0; i < CHARSET.length; i++) {
                    charToIndex.set(CHARSET[i], i);
                    indexToChar.push(CHARSET[i]);
                }
                
                // UI更新
                document.getElementById('charsetInfo').innerHTML = `
                    <p>✅ 文字セット読み込み完了</p>
                    <p>📊 対応文字数: ${CHARSET.length}文字（常用漢字2,136字 + ひらがな + カタカナ + 英数字 + 記号）</p>
                `;
                
                document.getElementById('processBtn').disabled = false;
                
            } catch (error) {
                document.getElementById('charsetInfo').innerHTML = `
                    <p>❌ エラー: ${error.message}</p>
                    <p>フォールバックモードで起動します...</p>
                `;
                
                // フォールバック: 基本的な文字セット
                const fallback = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゃゅょっアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポャュョッABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?;:()[]{}@#$%&*+-=_/<>"\'\n\t、。！？「」『』（）【】〜・';
                CHARSET = fallback;
                
                for (let i = 0; i < CHARSET.length; i++) {
                    charToIndex.set(CHARSET[i], i);
                    indexToChar.push(CHARSET[i]);
                }
                
                document.getElementById('processBtn').disabled = false;
            }
        }

        // パスワード入力時の情報更新
        document.getElementById('password').addEventListener('input', function() {
            const length = this.value.length;
            document.getElementById('passwordInfo').textContent = 
                `パスワード長: ${length}文字 → ローター数: ${length}個`;
        });

        // メッセージ入力時の文字チェック
        document.getElementById('message').addEventListener('input', function() {
            const message = this.value;
            let hasUnsupported = false;
            
            for (let char of message) {
                if (!charToIndex.has(char)) {
                    hasUnsupported = true;
                    break;
                }
            }
            
            document.getElementById('charWarning').style.display = hasUnsupported ? 'block' : 'none';
        });

        // SHA-256ハッシュ
        async function sha256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 疑似乱数生成器
        function createRNG(seed) {
            let state = parseInt(seed.substr(0, 8), 16);
            return () => {
                state = (state * 1103515245 + 12345) & 0x7fffffff;
                return state;
            };
        }

        // 真のEnigma（文字→文字変換）
        class TrueEnigma {
            constructor(password) {
                this.password = password;
                this.rotorCount = password.length;
                this.modulus = CHARSET.length;
            }

            async initialize() {
                // ローター配線を生成
                this.rotors = [];
                for (let i = 0; i < this.rotorCount; i++) {
                    const seed = await sha256(this.password + 'rotor' + i);
                    const rng = createRNG(seed);
                    
                    // 文字配列をシャッフル
                    const wiring = [...indexToChar];
                    for (let j = wiring.length - 1; j > 0; j--) {
                        const k = rng() % (j + 1);
                        [wiring[j], wiring[k]] = [wiring[k], wiring[j]];
                    }
                    this.rotors.push(wiring.join(''));
                }

                // リフレクター生成
                const seed = await sha256(this.password + 'reflector');
                const rng = createRNG(seed);
                const chars = [...indexToChar];
                
                // シャッフル
                for (let i = chars.length - 1; i > 0; i--) {
                    const j = rng() % (i + 1);
                    [chars[i], chars[j]] = [chars[j], chars[i]];
                }
                
                // ペア作成
                this.reflector = new Map();
                const half = Math.floor(chars.length / 2);
                for (let i = 0; i < half; i++) {
                    this.reflector.set(chars[i], chars[chars.length - 1 - i]);
                    this.reflector.set(chars[chars.length - 1 - i], chars[i]);
                }
                if (chars.length % 2 === 1) {
                    this.reflector.set(chars[half], chars[half]);
                }

                // 初期位置
                this.positions = [];
                for (let i = 0; i < this.rotorCount; i++) {
                    const seed = await sha256(this.password + 'pos' + i);
                    this.positions.push(parseInt(seed.substr(0, 4), 16) % this.modulus);
                }
            }

            rotateRotors() {
                this.positions[this.rotorCount - 1] = (this.positions[this.rotorCount - 1] + 1) % this.modulus;
                
                for (let i = this.rotorCount - 1; i > 0; i--) {
                    if (this.positions[i] === 0) {
                        this.positions[i - 1] = (this.positions[i - 1] + 1) % this.modulus;
                    } else {
                        break;
                    }
                }
            }

            throughRotor(index, rotorIndex, forward = true) {
                const rotor = this.rotors[rotorIndex];
                const position = this.positions[rotorIndex];
                
                if (forward) {
                    const offset = (index + position) % this.modulus;
                    const wire = charToIndex.get(rotor[offset]);
                    return (wire - position + this.modulus) % this.modulus;
                } else {
                    const offset = (index + position) % this.modulus;
                    const targetChar = indexToChar[offset];
                    const wire = rotor.indexOf(targetChar);
                    return (wire - position + this.modulus) % this.modulus;
                }
            }

            throughReflector(index) {
                const char = indexToChar[index];
                const reflected = this.reflector.get(char);
                return charToIndex.get(reflected);
            }

            encryptChar(char) {
                if (!charToIndex.has(char)) {
                    return char; // 未対応文字はそのまま
                }

                this.rotateRotors();

                let index = charToIndex.get(char);

                // 順方向
                for (let i = this.rotorCount - 1; i >= 0; i--) {
                    index = this.throughRotor(index, i, true);
                }

                // リフレクター
                index = this.throughReflector(index);

                // 逆方向
                for (let i = 0; i < this.rotorCount; i++) {
                    index = this.throughRotor(index, i, false);
                }

                return indexToChar[index];
            }

            encrypt(text) {
                let result = '';
                for (let char of text) {
                    result += this.encryptChar(char);
                }
                return result;
            }
        }

        async function process() {
            const password = document.getElementById('password').value;
            const message = document.getElementById('message').value;

            if (!password) {
                alert('パスワードを入力してください');
                return;
            }

            if (!message) {
                alert('メッセージを入力してください');
                return;
            }

            if (password.length < 3) {
                alert('パスワードは3文字以上にしてください');
                return;
            }

            document.getElementById('loading').classList.add('show');
            document.getElementById('result').classList.remove('show');

            setTimeout(async () => {
                try {
                    const startTime = Date.now();

                    const enigma = new TrueEnigma(password);
                    await enigma.initialize();
                    const result = enigma.encrypt(message);

                    const endTime = Date.now();
                    const timeTaken = endTime - startTime;

                    // 鍵空間をBigIntで計算
                    let keySpace = BigInt(CHARSET.length) ** BigInt(password.length);
                    let keySpaceStr;
                    
                    // BigIntを指数表記に変換
                    const digits = keySpace.toString();
                    if (digits.length > 10) {
                        // 大きすぎる場合は指数表記
                        const exponent = digits.length - 1;
                        const mantissa = digits[0] + '.' + digits.substring(1, 4);
                        keySpaceStr = `${mantissa} × 10^${exponent}`;
                    } else {
                        // 小さい場合はそのまま
                        keySpaceStr = keySpace.toLocaleString();
                    }

                    document.getElementById('resultTitle').innerHTML = '🔄 変換結果 <button class="copy-btn" onclick="copyResult()">📋 コピー</button>';
                    document.getElementById('resultText').textContent = result;
                    document.getElementById('stats').innerHTML = `
                        <p><strong>ローター数:</strong> ${password.length}個</p>
                        <p><strong>文字セット:</strong> ${CHARSET.length}文字</p>
                        <p><strong>入力文字数:</strong> ${message.length}文字</p>
                        <p><strong>出力文字数:</strong> ${result.length}文字</p>
                        <p><strong>鍵空間:</strong> ${CHARSET.length}^${password.length} ≈ ${keySpaceStr} 通り</p>
                        <p><strong>処理時間:</strong> ${timeTaken}ms</p>
                    `;

                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('result').classList.add('show');
                } catch (error) {
                    alert('エラーが発生しました: ' + error.message);
                    document.getElementById('loading').classList.remove('show');
                }
            }, 100);
        }

        // コピー機能
        function copyResult() {
            const resultText = document.getElementById('resultText').textContent;
            navigator.clipboard.writeText(resultText).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '✓ コピー完了';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('コピーに失敗しました: ' + err);
            });
        }

        // ページ読み込み時に初期化
        window.addEventListener('load', initialize);
    </script>
</body>
</html>
