<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebRTC P2P Chat</title>
  <link rel="icon" href="data:,">
  <style>
    /* タッチ操作での拡大を防止 */
    body {
      font-family: 'Inter', 'Noto Sans JP', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      touch-action: pan-y pan-x;
      -ms-touch-action: pan-y pan-x;
      height: 100vh;
      overflow: hidden;
    }
    /* ダブルタップズームを防止 */
    * {
      touch-action: manipulation;
    }
    /* テキスト選択時の拡大を防止 */
    input, textarea, select {
      touch-action: manipulation;
    }

    /* ========== ログイン画面（接続前） ========== */
    #loginScreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow-y: auto;
    }
    #loginScreen h1 {
      margin-bottom: 20px;
      font-size: 2rem;
    }
    #loginScreen .loginBox {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      text-align: center;
      color: #333;
      max-width: 400px;
      width: 90%;
      margin: 20px;
    }
    #loginScreen .loginBox p {
      margin: 10px 0;
      font-size: 0.9rem;
    }
    #loginScreen .loginBox strong {
      font-size: 1.2rem;
      color: #667eea;
    }
    #loginScreen input {
      padding: 12px;
      margin: 10px 0;
      width: calc(100% - 24px);
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    #loginScreen button {
      padding: 12px 24px;
      margin: 10px 5px;
      cursor: pointer;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s;
    }
    #loginScreen button:hover {
      background: #5568d3;
    }
    
    /* QRコード表示ボタン */
    #showQrBtn {
      background: #48bb78;
      margin-top: 10px;
    }
    #showQrBtn:hover {
      background: #38a169;
    }
    
    /* ========== モーダル（QRコード表示） ========== */
    #qrModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    #qrModal.show {
      display: flex;
    }
    
    #qrModalContent {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
      animation: modalSlideIn 0.3s ease-out;
    }
    
    @keyframes modalSlideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    #qrModalContent h2 {
      margin: 0 0 20px 0;
      color: #667eea;
      font-size: 1.5rem;
    }
    
    #closeQrBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    #closeQrBtn:hover {
      background: #c53030;
    }
    
    #qrcode {
      background: white;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      margin: 20px 0;
    }
    
    #shareLink {
      margin-top: 15px;
      padding: 12px;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      word-break: break-all;
      font-size: 0.85rem;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
    }
    #shareLink:hover {
      background: #edf2f7;
      border-color: #667eea;
    }

    /* ========== チャット画面（接続後） ========== */
    #chatScreen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #chatScreen.active {
      display: flex;
    }

    /* ヘッダー */
    #chatHeader {
      background: #667eea;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #chatHeader .left {
      flex: 1;
      text-align: left;
    }
    
    #chatHeader .center {
      flex: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    
    #chatHeader .right {
      flex: 1;
      text-align: right;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }
    
    #encryptionStatus {
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    
    /* 音声通話ボタン（右上） */
    #voiceCallBtn {
      background: #48bb78;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #voiceCallBtn:hover {
      background: #38a169;
      transform: scale(1.05);
    }
    #voiceCallBtn.calling {
      background: #e53e3e;
      animation: pulse 1.5s infinite;
    }
    
    /* スピーカー切り替えボタン（スマホのみ表示） */
    #speakerBtn {
      background: #4299e1;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.3s;
      display: none; /* デフォルトは非表示 */
      align-items: center;
      gap: 5px;
    }
    #speakerBtn:hover {
      background: #3182ce;
      transform: scale(1.05);
    }
    #speakerBtn.speaker-on {
      background: #48bb78;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ========== 通話リクエストモーダル ========== */
    #callRequestModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    #callRequestModal.show {
      display: flex;
    }
    
    #callRequestContent {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: modalSlideIn 0.3s ease-out;
    }
    
    #callRequestContent h2 {
      margin: 0 0 20px 0;
      color: #333;
      font-size: 1.5rem;
    }
    
    #callRequestContent p {
      color: #666;
      margin: 10px 0 30px 0;
      font-size: 1.1rem;
    }
    
    .callRequestButtons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    
    .callRequestButtons button {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    #acceptCallBtn {
      background: #48bb78;
      color: white;
    }
    #acceptCallBtn:hover {
      background: #38a169;
      transform: scale(1.05);
    }
    
    #rejectCallBtn {
      background: #e53e3e;
      color: white;
    }
    #rejectCallBtn:hover {
      background: #c53030;
      transform: scale(1.05);
    }

    /* ========== 通話画面 ========== */
    #voiceCallScreen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    #voiceCallScreen.active {
      display: flex;
    }
    
    .callInfo {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .callInfo h2 {
      font-size: 2rem;
      margin: 0 0 10px 0;
    }
    
    .callInfo p {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    
    .callTimer {
      font-size: 3rem;
      font-weight: bold;
      margin: 30px 0;
    }
    
    .callControls {
      display: flex;
      gap: 30px;
    }
    
    .callControlBtn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 2rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .callControlBtn:hover {
      transform: scale(1.1);
    }
    
    #muteBtn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    #muteBtn.muted {
      background: #e53e3e;
    }
    
    #endCallBtn {
      background: #e53e3e;
      color: white;
    }
    #endCallBtn:hover {
      background: #c53030;
    }

    /* メッセージエリア */
    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f5f5f5;
    }
    #messages div {
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 12px;
      color: #333;
      word-wrap: break-word;
      max-width: 70%;
      clear: both;
    }
    
    /* 自分のメッセージ：右寄せ、薄い青背景 */
    #messages .msg-you {
      background: #e3eafc;
      margin-left: auto;
      float: right;
      text-align: left;
    }
    #messages .msg-you .name {
      color: #667eea;
      font-weight: bold;
    }
    
    /* 相手のメッセージ：左寄せ、白背景 */
    #messages .msg-peer {
      background: white;
      margin-right: auto;
      float: left;
      text-align: left;
    }
    #messages .msg-peer .name {
      color: #48bb78;
      font-weight: bold;
    }
    
    /* システムメッセージ */
    #messages .msg-system {
      background: #e2e8f0;
      font-style: italic;
      text-align: center;
      color: #666;
      max-width: 90%;
      margin: 10px auto;
      float: none;
      clear: both;
    }

    /* 入力エリア（下部固定） */
    #chatInput {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
    }
    #chatInput input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-right: 10px;
    }
    #chatInput button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    #chatInput button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>

  <!-- ========== ログイン画面 ========== -->
  <div id="loginScreen">
    <h1>WebRTCをつかったP2PたぶんChat</h1>
    <div class="loginBox">
      <p>Your ID:</p>
      <p><strong id="myId"></strong></p>
      <input id="peerId" placeholder="相手のIDを入力" />
      <button id="connectBtn">接続</button>
      <button id="showQrBtn">QRコードを表示</button>
    </div>
  </div>

  <!-- ========== QRコードモーダル ========== -->
  <div id="qrModal">
    <div id="qrModalContent">
      <button id="closeQrBtn">×</button>
      <h2>QRコードで共有</h2>
      <p style="color: #666; font-size: 0.9rem;">相手にこのQRコードを読み取ってもらってください</p>
      <div id="qrcode"></div>
      <div id="shareLink" title="クリックでコピー">リンクをコピー</div>
    </div>
  </div>

  <!-- ========== 通話リクエストモーダル ========== -->
  <div id="callRequestModal">
    <div id="callRequestContent">
      <h2>通話リクエスト</h2>
      <p><strong id="callerName"></strong> が音声通話を開始しようとしています</p>
      <div class="callRequestButtons">
        <button id="acceptCallBtn">応答</button>
        <button id="rejectCallBtn">拒否</button>
      </div>
    </div>
  </div>

  <!-- ========== チャット画面（接続後） ========== -->
  <div id="chatScreen">
    <div id="chatHeader">
      <div class="left">
        <span>接続中: <span id="peerName">-</span></span>
      </div>
      <div class="center">
        <span id="encryptionStatus" title="暗号化状態">暗号化状態:すっげぇ異常</span>
      </div>
      <div class="right">
        <button id="speakerBtn">🔊 スピーカー</button>
        <button id="voiceCallBtn">🎤 通話</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="chatInput">
      <input id="messageInput" placeholder="メッセージを入力..." />
      <button id="sendBtn">送信</button>
    </div>
  </div>

  <!-- ========== 通話画面 ========== -->
  <div id="voiceCallScreen">
    <div class="callInfo">
      <h2 id="callPeerName">相手の名前</h2>
      <p>音声通話中</p>
    </div>
    <div class="callTimer" id="callTimer">00:00</div>
    <div class="callControls">
      <button class="callControlBtn" id="muteBtn" title="ミュート">🎤</button>
      <button class="callControlBtn" id="endCallBtn" title="通話終了">📞</button>
    </div>
  </div>

  <!-- リモート音声再生用（非表示） -->
  <audio id="remoteAudio" autoplay></audio>

  <!-- QRコード生成ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script type="module">
    import { P2PClient } from './dist/webrtc.js';

    const client = new P2PClient();
    let callStartTime = null;
    let callTimerInterval = null;
    let isMuted = false;
    let isSpeakerMode = true; // スマホではデフォルトでスピーカーモード

    // スマートフォン判定
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // メッセージ表示共通関数
    function showSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      const messages = document.getElementById('messages');
      messages.scrollTop = messages.scrollHeight;
    }

    // 通話タイマー更新
    function updateCallTimer() {
      if (!callStartTime) return;
      
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      
      document.getElementById('callTimer').textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // マイク初期化（一度ミュート→解除）
    function initializeMicrophone() {
      client.muteMicrophone(true);
      setTimeout(() => {
        client.muteMicrophone(false);
        console.log('[Init] Microphone initialized');
      }, 100);
    }

    // サーバー接続
    await client.connectToServer('wss://mail.shudo-physics.com:443');
    const myId = client.getPeerId();
    document.getElementById('myId').textContent = myId;

    // スマホの場合のみスピーカーボタンを表示
    if (isMobileDevice()) {
      document.getElementById('speakerBtn').style.display = 'flex';
    }

    // URL生成
    const currentUrl = window.location.href.split('?')[0];
    const shareUrl = `${currentUrl}?who=${myId}`;
    
    // QRコード生成（初回のみ）
    let qrGenerated = false;
    function generateQR() {
      if (!qrGenerated) {
        new QRCode(document.getElementById('qrcode'), {
          text: shareUrl,
          width: 200,
          height: 200,
          colorDark: '#667eea',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
        qrGenerated = true;
      }
    }

    // 共有リンク表示とコピー機能
    const shareLinkElement = document.getElementById('shareLink');
    shareLinkElement.textContent = shareUrl;
    shareLinkElement.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrl);
        const originalText = shareLinkElement.textContent;
        shareLinkElement.textContent = 'コピーしました！';
        shareLinkElement.style.background = '#48bb78';
        shareLinkElement.style.color = 'white';
        
        setTimeout(() => {
          shareLinkElement.textContent = originalText;
          shareLinkElement.style.background = '#f7fafc';
          shareLinkElement.style.color = '#333';
        }, 2000);
      } catch (err) {
        alert('コピーに失敗しました: ' + err);
      }
    });

    // QRコード表示ボタン
    document.getElementById('showQrBtn').addEventListener('click', () => {
      generateQR();
      document.getElementById('qrModal').classList.add('show');
    });

    // QRコードモーダル閉じる
    document.getElementById('closeQrBtn').addEventListener('click', () => {
      document.getElementById('qrModal').classList.remove('show');
    });

    // モーダル背景クリックで閉じる
    document.getElementById('qrModal').addEventListener('click', (e) => {
      if (e.target.id === 'qrModal') {
        document.getElementById('qrModal').classList.remove('show');
      }
    });

    // URLパラメータから相手のIDを取得
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('who');
    
    if (targetPeerId && targetPeerId !== myId) {
      document.getElementById('peerId').value = targetPeerId;
    }

    // 接続ボタン
    document.getElementById('connectBtn').addEventListener('click', () => {
      const peerId = document.getElementById('peerId').value.trim();
      if (!peerId) {
        alert('相手のIDを入力してください');
        return;
      }
      
      // 自己接続チェック
      if (peerId === myId) {
        alert('自分自身には接続できません！');
        return;
      }
      
      client.connectToPeer(peerId);
      showSystemMessage(`ピア(ID: ${peerId})へ接続中...`);
    });

    // Enterキーで接続（ログイン画面）
    document.getElementById('peerId').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        document.getElementById('connectBtn').click();
      }
    });

    // ========== 音声通話機能 ==========
    
    // 通話ボタン
    document.getElementById('voiceCallBtn').addEventListener('click', async () => {
      // 通話リクエスト送信
      await client.send(JSON.stringify({
        type: 'call-request',
        from: myId
      }));
      
      showSystemMessage('通話リクエストを送信しました...');
    });

    // 通話応答
    document.getElementById('acceptCallBtn').addEventListener('click', async () => {
      document.getElementById('callRequestModal').classList.remove('show');
      
      try {
        await client.startAudioCall();
        
        // マイク初期化
        initializeMicrophone();
        
        // 通話画面に切り替え
        document.getElementById('chatScreen').classList.remove('active');
        document.getElementById('voiceCallScreen').classList.add('active');
        document.getElementById('callPeerName').textContent = document.getElementById('peerName').textContent;
        
        // タイマー開始
        callStartTime = Date.now();
        callTimerInterval = setInterval(updateCallTimer, 1000);
        
        // 応答メッセージ送信
        await client.send(JSON.stringify({
          type: 'call-accepted'
        }));
        
        showSystemMessage('通話を開始しました');
      } catch (error) {
        alert('マイクのアクセス許可が必要です');
        console.error(error);
      }
    });

    // 通話拒否
    document.getElementById('rejectCallBtn').addEventListener('click', async () => {
      document.getElementById('callRequestModal').classList.remove('show');
      
      await client.send(JSON.stringify({
        type: 'call-rejected'
      }));
      
      showSystemMessage('通話を拒否しました');
    });

    // ミュートボタン
    document.getElementById('muteBtn').addEventListener('click', () => {
      isMuted = !isMuted;
      client.muteMicrophone(isMuted);
      
      console.log('UI isMuted:', isMuted);
      
      const muteBtn = document.getElementById('muteBtn');
      if (isMuted) {
        muteBtn.textContent = '🔇';
        muteBtn.classList.add('muted');
      } else {
        muteBtn.textContent = '🎤';
        muteBtn.classList.remove('muted');
      }
    });

    // スピーカー切り替えボタン（スマホのみ）
    document.getElementById('speakerBtn').addEventListener('click', () => {
      isSpeakerMode = !isSpeakerMode;
      const speakerBtn = document.getElementById('speakerBtn');
      const remoteAudio = document.getElementById('remoteAudio');
      
      if (isSpeakerMode) {
        speakerBtn.textContent = '🔊 スピーカー';
        speakerBtn.classList.add('speaker-on');
        // スピーカー出力
        remoteAudio.volume = 1.0;
      } else {
        speakerBtn.textContent = '🎧 イヤホン';
        speakerBtn.classList.remove('speaker-on');
        // イヤホン出力（音量を下げる）
        remoteAudio.volume = 0.7;
      }
      
      console.log(`[Audio] Speaker mode: ${isSpeakerMode}`);
    });

    // 通話終了ボタン
    document.getElementById('endCallBtn').addEventListener('click', async () => {
      // 通話停止
      client.stopAudioCall();
      
      // タイマー停止
      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
      }
      callStartTime = null;
      
      // ミュート状態リセット
      isMuted = false;
      document.getElementById('muteBtn').textContent = '🎤';
      document.getElementById('muteBtn').classList.remove('muted');
      
      // チャット画面に戻る
      document.getElementById('voiceCallScreen').classList.remove('active');
      document.getElementById('chatScreen').classList.add('active');
      
      // 通話終了メッセージ送信
      await client.send(JSON.stringify({
        type: 'call-ended'
      }));
      
      showSystemMessage('通話を終了しました');
    });

    // 送信ボタン
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const message = document.getElementById('messageInput').value.trim();
      if (!message) return;
      
      await client.send(message);
      document.getElementById('messageInput').value = '';
      
      const div = document.createElement('div');
      div.className = 'msg-you';
      div.innerHTML = `<span class="name">You:</span> ${escapeHtml(message)}`;
      document.getElementById('messages').appendChild(div);
      scrollToBottom();
    });

    // HTMLエスケープ関数
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enterキーで送信（チャット画面）
    document.getElementById('messageInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && event.target.value.trim() !== '') {
        document.getElementById('sendBtn').click();
        event.preventDefault();
      }
    });

    // メッセージ受信
    client.onMessage((data) => {
      // JSON判定
      try {
        const message = JSON.parse(data);
        
        // 通話関連メッセージ処理
        if (message.type === 'call-request') {
          document.getElementById('callerName').textContent = message.from;
          document.getElementById('callRequestModal').classList.add('show');
          return;
        }
        
        if (message.type === 'call-accepted') {
          // マイク初期化
          initializeMicrophone();
          
          // 通話画面に切り替え
          document.getElementById('chatScreen').classList.remove('active');
          document.getElementById('voiceCallScreen').classList.add('active');
          document.getElementById('callPeerName').textContent = document.getElementById('peerName').textContent;
          
          // タイマー開始
          callStartTime = Date.now();
          callTimerInterval = setInterval(updateCallTimer, 1000);
          
          showSystemMessage('相手が応答しました');
          return;
        }
        
        if (message.type === 'call-rejected') {
          showSystemMessage('相手が通話を拒否しました');
          return;
        }
        
        if (message.type === 'call-ended') {
          // 通話停止
          client.stopAudioCall();
          
          // タイマー停止
          if (callTimerInterval) {
            clearInterval(callTimerInterval);
            callTimerInterval = null;
          }
          callStartTime = null;
          
          // ミュート状態リセット
          isMuted = false;
          document.getElementById('muteBtn').textContent = '🎤';
          document.getElementById('muteBtn').classList.remove('muted');
          
          // チャット画面に戻る
          document.getElementById('voiceCallScreen').classList.remove('active');
          document.getElementById('chatScreen').classList.add('active');
          
          showSystemMessage('相手が通話を終了しました');
          return;
        }
      } catch (e) {
        // 通常のテキストメッセージ
      }
      
      const div = document.createElement('div');
      div.className = 'msg-peer';
      div.innerHTML = `<span class="name">Peer:</span> ${escapeHtml(data)}`;
      document.getElementById('messages').appendChild(div);
      scrollToBottom();
    });

    // リモートストリーム受信
    client.onRemoteStream((stream) => {
      console.log('Remote audio stream received');
      document.getElementById('remoteAudio').srcObject = stream;
    });

    // 接続完了
    client.onConnect(() => {
      showSystemMessage("DataChannelがオープンしました");
    });

    // 切断
    client.onClose(() => {
      showSystemMessage("DataChannelが切断されました");
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('voiceCallScreen').classList.remove('active');
      document.getElementById('encryptionStatus').textContent = '暗号化状態:すっげぇ異常';
      
      // タイマー停止
      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
      }
      callStartTime = null;
    });

    // ピア接続完了
    client.onPeerConnect((peerId) => {
      showSystemMessage(`${peerId} に接続しました`);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('chatScreen').classList.add('active');
      document.getElementById('peerName').textContent = peerId;
      document.getElementById('messageInput').focus();
    });

    // ピア切断
    client.onPeerDisconnect((peerId) => {
      showSystemMessage(`${peerId} との接続が切断されました`);
    });

    // 暗号化確立
    client.onEncryptionEstablished(() => {
      document.getElementById('encryptionStatus').textContent = '暗号化状態:正常';
      showSystemMessage('暗号化OKどえす!');
    });
  </script>
</body>
</html>
