<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebRTC P2P Chat</title>
  <link rel="icon" href="data:,">
  <style>
    /* タッチ操作での拡大を防止 */
    body {
      font-family: 'Inter', 'Noto Sans JP', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      touch-action: pan-y pan-x;
      -ms-touch-action: pan-y pan-x;
      height: 100vh;
      overflow: hidden;
    }
    /* ダブルタップズームを防止 */
    * {
      touch-action: manipulation;
    }
    /* テキスト選択時の拡大を防止 */
    input, textarea, select {
      touch-action: manipulation;
    }

    /* ========== ログイン画面（接続前） ========== */
    #loginScreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow-y: auto;
    }
    #loginScreen h1 {
      margin-bottom: 20px;
      font-size: 2rem;
    }
    #loginScreen .loginBox {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      text-align: center;
      color: #333;
      max-width: 400px;
      width: 90%;
      margin: 20px;
    }
    #loginScreen .loginBox p {
      margin: 10px 0;
      font-size: 0.9rem;
    }
    #loginScreen .loginBox strong {
      font-size: 1.2rem;
      color: #667eea;
    }
    #loginScreen input {
      padding: 12px;
      margin: 10px 0;
      width: calc(100% - 24px);
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    #loginScreen button {
      padding: 12px 24px;
      margin: 10px 5px;
      cursor: pointer;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s;
    }
    #loginScreen button:hover {
      background: #5568d3;
    }
    
    /* QRコード表示ボタン */
    #showQrBtn {
      background: #48bb78;
      margin-top: 10px;
    }
    #showQrBtn:hover {
      background: #38a169;
    }
    
    /* ========== モーダル（QRコード表示） ========== */
    #qrModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    #qrModal.show {
      display: flex;
    }
    
    #qrModalContent {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
      animation: modalSlideIn 0.3s ease-out;
    }
    
    @keyframes modalSlideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    #qrModalContent h2 {
      margin: 0 0 20px 0;
      color: #667eea;
      font-size: 1.5rem;
    }
    
    #closeQrBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    #closeQrBtn:hover {
      background: #c53030;
    }
    
    #qrcode {
      background: white;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      margin: 20px 0;
    }
    
    #shareLink {
      margin-top: 15px;
      padding: 12px;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      word-break: break-all;
      font-size: 0.85rem;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
    }
    #shareLink:hover {
      background: #edf2f7;
      border-color: #667eea;
    }

    /* ========== チャット画面（接続後） ========== */
    #chatScreen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #chatScreen.active {
      display: flex;
    }

    /* ヘッダー */
    #chatHeader {
      background: #667eea;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    
    #encryptionStatus {
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    /* メッセージエリア */
    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f5f5f5;
    }
    #messages div {
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 12px;
      color: #333;
      word-wrap: break-word;
      max-width: 70%;
      clear: both;
    }
    
    /* 自分のメッセージ：右寄せ、薄い青背景 */
    #messages .msg-you {
      background: #e3eafc;
      margin-left: auto;
      float: right;
      text-align: left;
    }
    #messages .msg-you .name {
      color: #667eea;
      font-weight: bold;
    }
    
    /* 相手のメッセージ：左寄せ、白背景 */
    #messages .msg-peer {
      background: white;
      margin-right: auto;
      float: left;
      text-align: left;
    }
    #messages .msg-peer .name {
      color: #48bb78;
      font-weight: bold;
    }
    
    /* システムメッセージ */
    #messages .msg-system {
      background: #e2e8f0;
      font-style: italic;
      text-align: center;
      color: #666;
      max-width: 90%;
      margin: 10px auto;
      float: none;
      clear: both;
    }

    /* 入力エリア（下部固定） */
    #chatInput {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
    }
    #chatInput input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-right: 10px;
    }
    #chatInput button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    #chatInput button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>

  <!-- ========== ログイン画面 ========== -->
  <div id="loginScreen">
    <h1>WebRTCをつかったP2PたぶんChat</h1>
    <div class="loginBox">
      <p>Your ID:</p>
      <p><strong id="myId"></strong></p>
      <input id="peerId" placeholder="相手のIDを入力" />
      <button id="connectBtn">接続</button>
      <button id="showQrBtn">QRコードを表示したい場合はこちら</button>
    </div>
  </div>

  <!-- ========== QRコードモーダル ========== -->
  <div id="qrModal">
    <div id="qrModalContent">
      <button id="closeQrBtn">×</button>
      <h2>QRどえす</h2>
      <p style="color: #666; font-size: 0.9rem;">相手にこのQRコードを読み取ってもらってください</p>
      <div id="qrcode"></div>
      <div id="shareLink" title="クリックでコピー">リンクをコピー</div>
    </div>
  </div>

  <!-- ========== チャット画面 ========== -->
  <div id="chatScreen">
    <div id="chatHeader">
      <span>接続中: <span id="peerName">-</span></span>
      <span id="encryptionStatus" title="暗号化状態">暗号化状態:すっげぇ異常</span>
    </div>
    <div id="messages"></div>
    <div id="chatInput">
      <input id="messageInput" placeholder="メッセージを入力..." />
      <button id="sendBtn">送信</button>
    </div>
  </div>

  <!-- QRコード生成ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script type="module">
    import { P2PClient } from './dist/webrtc.js';

    const client = new P2PClient();

    // メッセージ表示共通関数
    function showSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      const messages = document.getElementById('messages');
      messages.scrollTop = messages.scrollHeight;
    }

    // サーバー接続
    await client.connectToServer('wss://mail.shudo-physics.com:443');
    const myId = client.getPeerId();
    document.getElementById('myId').textContent = myId;

    // URL生成
    const currentUrl = window.location.href.split('?')[0];
    const shareUrl = `${currentUrl}?who=${myId}`;
    
    // QRコード生成（初回のみ）
    let qrGenerated = false;
    function generateQR() {
      if (!qrGenerated) {
        new QRCode(document.getElementById('qrcode'), {
          text: shareUrl,
          width: 200,
          height: 200,
          colorDark: '#667eea',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
        qrGenerated = true;
      }
    }

    // 共有リンク表示とコピー機能
    const shareLinkElement = document.getElementById('shareLink');
    shareLinkElement.textContent = shareUrl;
    shareLinkElement.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrl);
        const originalText = shareLinkElement.textContent;
        shareLinkElement.textContent = '✅ コピーしました！';
        shareLinkElement.style.background = '#48bb78';
        shareLinkElement.style.color = 'white';
        
        setTimeout(() => {
          shareLinkElement.textContent = originalText;
          shareLinkElement.style.background = '#f7fafc';
          shareLinkElement.style.color = '#333';
        }, 2000);
      } catch (err) {
        alert('コピーに失敗しました: ' + err);
      }
    });

    // QRコード表示ボタン
    document.getElementById('showQrBtn').addEventListener('click', () => {
      generateQR();
      document.getElementById('qrModal').classList.add('show');
    });

    // QRコードモーダル閉じる
    document.getElementById('closeQrBtn').addEventListener('click', () => {
      document.getElementById('qrModal').classList.remove('show');
    });

    // モーダル背景クリックで閉じる
    document.getElementById('qrModal').addEventListener('click', (e) => {
      if (e.target.id === 'qrModal') {
        document.getElementById('qrModal').classList.remove('show');
      }
    });

    // URLパラメータから相手のIDを取得
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('who');
    
    if (targetPeerId && targetPeerId !== myId) {
      document.getElementById('peerId').value = targetPeerId;
    }

    // 接続ボタン
    document.getElementById('connectBtn').addEventListener('click', () => {
      const peerId = document.getElementById('peerId').value.trim();
      if (!peerId) {
        alert('相手のIDを入力してください');
        return;
      }
      
      // 自己接続チェック
      if (peerId === myId) {
        alert('自分自身には接続できません');
        return;
      }
      
      client.connectToPeer(peerId);
      showSystemMessage(`ピア(ID: ${peerId})へ接続中...`);
    });

    // Enterキーで接続（ログイン画面）
    document.getElementById('peerId').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        document.getElementById('connectBtn').click();
      }
    });

    // 送信ボタン
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const message = document.getElementById('messageInput').value.trim();
      if (!message) return;
      
      await client.send(message);
      document.getElementById('messageInput').value = '';
      
      const div = document.createElement('div');
      div.className = 'msg-you';
      div.innerHTML = `<span class="name">You:</span> ${escapeHtml(message)}`;
      document.getElementById('messages').appendChild(div);
      scrollToBottom();
    });

    // HTMLエスケープ関数
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enterキーで送信（チャット画面）
    document.getElementById('messageInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && event.target.value.trim() !== '') {
        document.getElementById('sendBtn').click();
        event.preventDefault();
      }
    });

    // メッセージ受信
    client.onMessage((data) => {
      const div = document.createElement('div');
      div.className = 'msg-peer';
      div.innerHTML = `<span class="name">Peer:</span> ${escapeHtml(data)}`;
      document.getElementById('messages').appendChild(div);
      scrollToBottom();
    });

    // 接続完了
    client.onConnect(() => {
      showSystemMessage("DataChannelがオープンしました");
    });

    // 切断
    client.onClose(() => {
      showSystemMessage("DataChannelが切断されました");
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('encryptionStatus').textContent = '暗号化状態:すっげぇ異常';
    });

    // ピア接続完了
    client.onPeerConnect((peerId) => {
      showSystemMessage(`${peerId} に接続しました`);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('chatScreen').classList.add('active');
      document.getElementById('peerName').textContent = peerId;
      document.getElementById('messageInput').focus();
    });

    // ピア切断
    client.onPeerDisconnect((peerId) => {
      showSystemMessage(`${peerId} との接続が切断されました`);
    });

    // 暗号化確立
    client.onEncryptionEstablished(() => {
      document.getElementById('encryptionStatus').textContent = '暗号化状態:正常';
      showSystemMessage('暗号化OKどえす!');
    });
  </script>
</body>
</html>
